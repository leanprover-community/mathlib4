# This file tracks additional formalizations of theorems from the 1000+ theorems project
# (https://1000-plus.github.io/), which are outside of mathlib but we want to still list on the
# mathlib webpage.
#
# Note: the criteria for inclusion in this list are rather strict: a theorem can be listed only if
# it is part of one of the following repositories:
# - cslib or physlib (de-facto official libraries for CS and Physics, respectively)
# - LeanCamCombi (quasi-official library for combinatorics that cannot be in mathlib yet)
# - combinatorialgames (used to be part of mathlib, now maintained separately)
#
# Further additions must be decided on by the mathlib maintainers.

