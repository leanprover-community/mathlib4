self-hosted-runner:
  labels:
    - bors
    - pr
    - doc-gen
    - lean4checker
    # A GitHub-hosted label that actionlint's built-in list does not know yet.
    - ubuntu-26.04
paths:
  .github/workflows/*.yml:
    ignore:
      # actionlint 1.7.12 doesn't know the `cache-mode` key yet (rhysd/actionlint#745).
      - 'unexpected key "cache-mode" for "job" section'
