# Single source of truth mapping (repo, ref) → (upload container,
# read fallback chain) for Mathlib's multi-container cache.
#
# Called by build, upload_cache, and post_steps in build_template.yml so
# trust classification is decided in exactly one place. Lean-side cache
# logic stays branch-agnostic; this composite is the seam where CI-only
# trust policy lives.

name: Cache trust dispatch
description: Compute the cache container target and read fallback for this job.

inputs:
  repo:
    description: GitHub repo full name (`owner/name`).
    required: true
  branch:
    description: |
      Branch name (`github.head_ref || github.ref_name`); on tag-triggered
      runs this is the tag name, distinguished via `github.ref_type` inside
      the dispatch step.
    required: true
  head-sha:
    description: |
      Head commit SHA for the ref being built. Used as the per-commit cache
      namespace (`MATHLIB_CACHE_REPO_SCOPE`) for forks and nightly uploads, so a
      closed/hidden PR's poisoned artifacts cannot be served to a later
      honest PR from the same fork.
    required: true

# Outputs are mirrored to $GITHUB_ENV inside the step, which is what
# downstream `cache get` / `cache put-staged` calls actually read. We
# also expose them as action outputs for callers that need them in
# `with:` blocks (e.g. constructing further `if:` conditions).
outputs:
  primary:
    description: Container name for uploads (master, forks, nightly-testing).
    value: ${{ steps.dispatch.outputs.primary }}
  read-chain:
    description: |
      Comma-separated read fallback chain for `MATHLIB_CACHE_FROM`. Empty
      when the job should use the cache tool's repo-level default.
    value: ${{ steps.dispatch.outputs.read-chain }}
  repo-scope:
    description: |
      Per-commit namespace suffix for `MATHLIB_CACHE_REPO_SCOPE`. Set to
      the head SHA for forks and nightly-testing; empty for master.
    value: ${{ steps.dispatch.outputs.repo-scope }}

runs:
  using: composite
  steps:
    - name: Compute trust dispatch
      id: dispatch
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        BRANCH: ${{ inputs.branch }}
        HEAD_SHA: ${{ inputs.head-sha }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        PRIMARY=""
        READ_CHAIN=""
        REPO_SCOPE=""

        # Storage credentials enforce write isolation. This action chooses
        # the matching read and write paths for an honest workflow.
        # Cross-repository PRs use the base repository's forks credential.
        if [ "$REPO" != "$GITHUB_REPOSITORY" ]; then
          PRIMARY="forks"
          READ_CHAIN="master,forks"
        else
        case "$REPO" in
          "leanprover-community/mathlib4")
            if [ "$REF_TYPE" = "tag" ]; then
              case "$BRANCH" in
                v4.*)
                  # `v4.*` release tags: release_cache.yml rebuilds off-master
                  # release commits (patch releases, patched release
                  # candidates) and publishes them into `master`, the container
                  # canonical checkouts read. Tag creation is restricted to
                  # release managers by a tag ruleset, and the
                  # `cache-upload-master` environment admits `v4.*` tag refs,
                  # so these builds carry master trust. Reads use the tool's
                  # default for the canonical repo, `master` alone, for the
                  # same fill-in reason as the master/staging arm below.
                  PRIMARY="master"
                  ;;
                *)
                  # Other tags have no trust class of their own:
                  # fork-equivalent, like the dev-branch arm below.
                  PRIMARY="forks"
                  READ_CHAIN="master,forks"
                  ;;
              esac
            else
              case "$BRANCH" in
                "master"|"staging")
                  # Master, staging, and `v4.*` release tags (above) are the
                  # only writers that feed `master` (`staging` is bors's merge
                  # candidate, which fast-forwards to `master`). Reads use the
                  # tool's default for the canonical repo, `master` alone, and
                  # the chain must not widen: files the read chain serves are
                  # skipped at stage time, so every file missing from `master`
                  # is a miss that gets rebuilt and uploaded, and `master`
                  # fills itself into a standalone cache. (Only PRIMARY=master
                  # does this; other runs write to `forks` and widen the
                  # chain.)
                  PRIMARY="master"
                  ;;
                *)
                  # `bors trying`, `ci-dev/*`, maintainer dev branches on the
                  # canonical repo: trust level is fork-equivalent (the OIDC
                  # token's RBAC scopes them to `forks`). Reads must widen
                  # past the default [master] so the post-build verification
                  # finds the just-uploaded fork-trust artifacts.
                  PRIMARY="forks"
                  READ_CHAIN="master,forks"
                  ;;
              esac
            fi
            ;;
          "leanprover-community/mathlib4-nightly-testing")
            PRIMARY="nightly-testing"
            READ_CHAIN="master,nightly-testing"
            ;;
          *)
            # Foreign fork. The cache tool's default chain for a fork repo
            # is [master, forks] (master-first): master supplies the
            # bulk of unchanged upstream deps, forks supplies PR-specific
            # files. No widening needed, so MATHLIB_CACHE_FROM stays unset.
            PRIMARY="forks"
            ;;
        esac
        fi

        # Each non-public writer gets a namespace for this exact build commit.
        if [ "$PRIMARY" = "forks" ] || [ "$PRIMARY" = "nightly-testing" ]; then
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::a scoped cache upload requires a full lowercase commit SHA"
            exit 1
          fi
          REPO_SCOPE="$HEAD_SHA"
        fi

        echo "primary=$PRIMARY"           >> "$GITHUB_OUTPUT"
        echo "read-chain=$READ_CHAIN"     >> "$GITHUB_OUTPUT"
        echo "repo-scope=$REPO_SCOPE"     >> "$GITHUB_OUTPUT"
        echo "MATHLIB_CACHE_PRIMARY=$PRIMARY" >> "$GITHUB_ENV"
        if [ -n "$READ_CHAIN" ]; then
          echo "MATHLIB_CACHE_FROM=$READ_CHAIN" >> "$GITHUB_ENV"
        fi
        if [ -n "$REPO_SCOPE" ]; then
          echo "MATHLIB_CACHE_REPO_SCOPE=$REPO_SCOPE" >> "$GITHUB_ENV"
        fi
        # Visible in CI logs so a glance at any cache-touching step shows
        # what trust class the job is operating under.
        SCOPE_NOTE=""
        if [ -n "$REPO_SCOPE" ]; then
          SCOPE_NOTE=", MATHLIB_CACHE_REPO_SCOPE=$REPO_SCOPE"
        fi
        if [ -n "$READ_CHAIN" ]; then
          echo "cache-trust-dispatch: REPO=$REPO BRANCH=$BRANCH → container=$PRIMARY, MATHLIB_CACHE_FROM=$READ_CHAIN$SCOPE_NOTE"
        else
          echo "cache-trust-dispatch: REPO=$REPO BRANCH=$BRANCH → container=$PRIMARY, MATHLIB_CACHE_FROM=<default>$SCOPE_NOTE"
        fi
