# The open PR from a head branch of this repository, or the PR `number` when given, with its
# labels. When `head-sha` is given, only a PR whose head is that commit counts, so a run for an
# older commit finds no PR. An API error fails the step, so a failed lookup never reads as
# "no PR".

name: Find the open PR
description: Find the open PR from a head branch, or check one PR, and read its labels.

inputs:
  token:
    description: "A token with `pull-requests: read`."
    required: true
  branch:
    description: The head branch, in this repository. Not used when `number` is set.
    required: false
  number:
    description: The PR to check instead of looking one up from `branch`.
    required: false
  head-sha:
    description: When set, only a PR whose head is this commit counts.
    required: false

outputs:
  pr_found:
    description: "`true` when an open PR was found, else `false`."
    value: ${{ steps.find.outputs.pr_found }}
  number:
    description: The PR number. Empty when no PR was found.
    value: ${{ steps.find.outputs.number }}
  pr_url:
    description: The PR's web URL. Empty when no PR was found.
    value: ${{ steps.find.outputs.pr_url }}
  pr_labels:
    description: The PR's label names, comma-separated. Empty when no PR was found.
    value: ${{ steps.find.outputs.pr_labels }}

runs:
  using: composite
  steps:
    - id: find
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch }}
        NUMBER: ${{ inputs.number }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        # The candidates: the given PR, or the open PRs from the head branch.
        if [ -n "$NUMBER" ]; then
          prs=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" --jq '[.]')
        else
          prs=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" -f state=open \
            -f head="${GITHUB_REPOSITORY_OWNER}:${BRANCH}")
        fi
        pr=$(jq --arg sha "$HEAD_SHA" \
          'map(select(.state == "open" and ($sha == "" or .head.sha == $sha))) | first // empty' \
          <<<"$prs")
        if [ -z "$pr" ]; then
          echo "pr_found=false" | tee -a "$GITHUB_OUTPUT"
          exit 0
        fi
        {
          echo "pr_found=true"
          echo "number=$(jq -r '.number' <<<"$pr")"
          echo "pr_url=$(jq -r '.html_url' <<<"$pr")"
          echo "pr_labels=$(jq -r '[.labels[].name] | join(",")' <<<"$pr")"
        } | tee -a "$GITHUB_OUTPUT"
