# Builds the trusted CI tooling (the `cache`, `mk_all` and `runLinter` binaries + the
# `lake-build-*` helper scripts) from the pushed `master` commit (`github.sha`) and
# publishes it as a small artifact (`tools-bin`).
#
# CI runs (build_template.yml, via the `get-tools` composite action) download this
# artifact and use the tools directly, saving a full `master` checkout plus a ~30s
# build on every run. They build the tools from source when no artifact is
# available, when a non-`master` tools branch is requested (bors, ci_dev,
# nightly-testing), or when the artifact's tool sources differ from the tool
# sources at the commit of the calling workflow.
#
# Trust model: get-tools downloads the artifact only from this workflow's `push`
# runs on `master` of the canonical repository, so a CI run that uses the artifact
# runs tools built from `master` code. get-tools does not consume the artifacts of
# `workflow_dispatch` runs.
name: publish CI tools

on:
  push:
    branches:
      - master
  # Manual runs check that the tools build; get-tools does not download their artifacts.
  workflow_dispatch:

concurrency:
  # Only keep the latest publish run; superseded master pushes are cancelled.
  group: publish-tools-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish tools
    # Only publish from the canonical repository. nightly-testing has no `master`
    # branch and builds its tools from `nightly-testing-green` on demand instead.
    if: github.repository == 'leanprover-community/mathlib4'
    # Must run on the same kind of runner as the consumers (build_template's `pr`
    # runners), so the binary we build here will run on the machines that use it.
    runs-on: pr
    steps:
      # Build the pushed commit, so the run's head SHA names the source of the
      # artifact; get-tools compares the tool sources at that SHA with the tool
      # sources of the workflow that downloads the artifact. Build under
      # `tools-branch/`, the same directory `build_template.yml` unpacks the tools
      # into, in case the build bakes its own location into the binary.
      - name: Checkout the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tools-branch

      - name: install elan
        shell: bash
        run: |
          set -o pipefail
          curl -o elan-init.sh -sSfL https://elan.lean-lang.org/elan-init.sh
          chmod +x elan-init.sh
          ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "${GITHUB_PATH}"

      - name: build tools
        shell: bash
        run: |
          cd tools-branch
          # This job runs outside a sandbox and produces the tools that CI trusts, so Lake builds
          # them and their dependencies from this commit's sources. The empty `LAKE_CACHE_DIR`
          # selects the empty artifact cache in `.lake/cache` instead of the runner's shared Lake
          # cache, and `LAKE_NO_CACHE` stops the download of dependency builds (Reservoir, GitHub
          # releases). The Mathlib cache (`lake exe cache get`) is not used.
          export LAKE_CACHE_DIR='' LAKE_NO_CACHE=1
          # `check-yaml` and `graph` are built as a smoke test that the tools at this
          # commit compile; `cache`, `mk_all` and `runLinter` are consumed by path.
          lake build cache check-yaml graph
          ls .lake/build/bin/cache
          # Without `mk_all`, the artifact ships `cache` alone and the build job runs
          # `lake exe mk_all`.
          if lake build mk_all; then
            ls .lake/build/bin/mk_all
          else
            echo "::warning::mk_all did not build; the tools artifact ships without it."
            rm -f .lake/build/bin/mk_all
          fi
          # `runLinter` is the lint driver from Batteries. Without it, the artifact ships without
          # the driver and the lint step runs `lake lint`.
          if lake build batteries/runLinter; then
            ls .lake/packages/batteries/.lake/build/bin/runLinter
          else
            echo "::warning::runLinter did not build; the tools artifact ships without it."
            rm -f .lake/packages/batteries/.lake/build/bin/runLinter
          fi

      - name: bundle tools
        shell: bash
        run: |
          cd tools-branch
          # Tarball (rather than a plain directory artifact) so that executable bits
          # and the hidden `.lake` directory survive upload/download without relying
          # on `include-hidden-files` or post-download `chmod`.
          #
          # We bundle exactly what `build_template.yml` invokes from `tools-branch/`:
          #   - .lake/build:                    holds the `cache` and `mk_all` binaries
          #                                     that the build job runs by path
          #                                     (.lake/build/bin/). We ship the whole build
          #                                     dir, not just the binaries, in case they
          #                                     need other files there to run. The Mathlib
          #                                     oleans that `mk_all` was built against are
          #                                     left out.
          #   - scripts/lake-build-with-retry.sh: builds Mathlib/Archive/Counterexamples/
          #                                     Wanted with retries.
          #   - scripts/lake-build-wrapper.py:  wraps the `lake test` step.
          #   - scripts/mk_all.lean, Mathlib/Util/GetAllModules.lean: the sources of
          #                                     `mk_all`; the build job runs the prebuilt
          #                                     binary only when the branch has the same.
          #   - .lake/packages/batteries/.lake/build/bin/runLinter: the lint driver.
          #   - lakefile.lean, lake-manifest.json: the lint configuration and the Batteries
          #                                     revision of `runLinter`; the lint step runs
          #                                     the prebuilt driver only when the branch has
          #                                     the same.
          #   - lean-toolchain:                 the toolchain this binary was built with;
          #                                     the consumer installs it (via elan) so the
          #                                     binary has a matching Lean to run against,
          #                                     even when the PR uses a newer toolchain.
          files=(.lake/build scripts/lake-build-with-retry.sh scripts/lake-build-wrapper.py
            scripts/mk_all.lean Mathlib/Util/GetAllModules.lean lakefile.lean lake-manifest.json
            lean-toolchain)
          if [[ -x .lake/packages/batteries/.lake/build/bin/runLinter ]]; then
            files+=(.lake/packages/batteries/.lake/build/bin/runLinter)
          fi
          tar -czf "${GITHUB_WORKSPACE}/tools-bin.tar.gz" \
            --exclude=.lake/build/lib/lean/Mathlib \
            --exclude=.lake/build/ir/Mathlib \
            "${files[@]}"
          ls -l "${GITHUB_WORKSPACE}/tools-bin.tar.gz"

      - name: upload tools artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-bin
          path: tools-bin.tar.gz
          # Master is pushed frequently, so a short retention keeps storage bounded
          # while still leaving a recent artifact available.
          retention-days: 7
          if-no-files-found: error
