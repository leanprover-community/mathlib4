name: Prepare I2 dihedral PR

on:
  push:
    branches: [feat/coxeter-i2-dihedral]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coxeter-i2-dihedral
      - name: Install Lean
        run: |
          set -euo pipefail
          curl --retry 3 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan.sh"
          bash "$RUNNER_TEMP/elan.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        run: |
          set -euo pipefail
          lake exe cache get
      - name: Generate Mathlib.lean and verify module
        run: |
          set -uo pipefail
          set +e
          lake exe mk_all
          MKALL_RC=$?
          set -e
          if [ "$MKALL_RC" -ne 0 ] && git diff --quiet -- Mathlib.lean; then
            echo "mk_all failed without generating the expected Mathlib.lean change"
            exit "$MKALL_RC"
          fi
          lake env lean Mathlib/GroupTheory/Coxeter/Dihedral.lean
          lake exe lint-style Mathlib/GroupTheory/Coxeter/Dihedral.lean
          test -z "$(grep -nE '\bsorry\b|\badmit\b' Mathlib/GroupTheory/Coxeter/Dihedral.lean || true)"
          git diff --check
      - name: Commit generated import
        run: |
          set -euo pipefail
          if git diff --quiet -- Mathlib.lean; then
            echo 'Mathlib.lean already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mathlib.lean
          git commit -m 'chore: update generated Mathlib imports'
          git push origin HEAD:feat/coxeter-i2-dihedral
