name: Daily master tag

on:
  schedule:
    # Run daily at 10:00 UTC (after nightly-testing has settled)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.repository == 'leanprover-community/mathlib4'
    environment:
      name: daily-master-tag
      deployment: false
    permissions:
      contents: read
      # Required for the token-minting action to request a GitHub OIDC token,
      # which it exchanges at the GitHub App broker for a GitHub App installation token.
      id-token: write
    steps:
      - name: Generate app token
        id: app-token
        uses: leanprover-community/mathlib-ci/.github/actions/mint-github-app-token@3100b8176f64a2ec14036e807c233b3e6f300a59
        with:
          broker-url: ${{ vars.MATHLIB_GITHUB_APP_BROKER_URL }}
          audience: mathlib-github-app-broker
          app: mathlib-daily-master-tag

      # Check out with the app token so that the credentials persisted into the
      # local git config (and used by `git push` below) are the app's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          token: ${{ steps.app-token.outputs.token }}

      - name: Create daily tag
        run: |
          TAG="master-$(date -u +%Y-%m-%d)"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi
