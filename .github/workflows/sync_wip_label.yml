name: Synchronise WIP label

on:
  pull_request_target:
    types:
      - labeled
      - unlabeled
      - converted_to_draft
      - ready_for_review

# Limit permissions for GH_TOKEN for the entire workflow
permissions:
  pull-requests: write  # Only allow PR comments/labels
  issues: write
  # All other permissions are implicitly 'none'

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  sync-wip-label:
    runs-on: ubuntu-latest
    # Don't run on forks, where we wouldn't have permissions to add the label anyway.
    if: github.repository == 'leanprover-community/mathlib4'
    steps:
      - name: add label WIP
        if: github.event.action == converted_to_draft
        run: gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label 'WIP'
      - name: remove label WIP
        if: github.event.action == ready_for_review
        run: gh pr edit "${PR_NUMBER}" --repo "${REPO}" --remove-label 'WIP'
      - name: mark as draft
        if: github.event.action == labeled && github.event.label.name == 'WIP' && github.event.pull_request.draft != true
        run: gh pr ready "${PR_NUMBER}" --repo "${REPO}" --undo
      - name: mark ready to review
        if: github.event.action == unlabeled && github.event.label.name == 'WIP' && github.event.pull_request.draft == true
        run: gh pr ready "${PR_NUMBER}" --repo "${REPO}"
