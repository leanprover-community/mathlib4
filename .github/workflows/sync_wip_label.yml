name: Synchronize WIP label

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
      - converted_to_draft
      - ready_for_review

# Limit permissions for `GH_TOKEN` for the entire workflow
permissions:
  pull-requests: write
  contents: write
  # All other permissions are implicitly 'none'

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  sync-wip-label:
    runs-on: ubuntu-latest
    # Don't run on forks, where we wouldn't have permissions to add the label anyway.
    if: github.repository == 'leanprover-community/mathlib4'
    steps:
      - name: add label WIP
        if: github.event.action == 'converted_to_draft' || (github.event.action == 'opened' && github.event.pull_request.draft)
        run: gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label 'WIP'
      - name: remove label WIP
        if: github.event.action == 'ready_for_review'
        run: gh pr edit "${PR_NUMBER}" --repo "${REPO}" --remove-label 'WIP'
      - name: convert to draft
        if: (github.event.action == 'labeled' || github.event.action == 'reopened') && github.event.label.name == 'WIP' && !github.event.pull_request.draft
        run: gh pr ready "${PR_NUMBER}" --repo "${REPO}" --undo
      - name: mark ready for review (open PRs)
        # closed PRs cannot change their draft status
        if: github.event.action == 'unlabeled' && github.event.pull_request.state == 'open' && github.event.label.name == 'WIP' && github.event.pull_request.draft
        run: gh pr ready "${PR_NUMBER}" --repo "${REPO}"
