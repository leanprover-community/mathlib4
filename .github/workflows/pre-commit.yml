name: Run pre-commit and in-place update PR on push

on:
  push:
    branches-ignore:
      # ignore tmp branches used by bors
      - 'staging.tmp*'
      - 'trying.tmp*'
      - 'staging*.tmp'
      - 'nolints'
      # ignore staging and trying branches used by bors, these are handled by bors.yml
      - 'staging'
      - 'trying'
      - 'ci-dev/**' # ignore branches meant for experiments
      - 'master'
  pull_request:

# extracted from https://pre-commit.ci/lite
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.x
    - uses: leanprover-community/mathlib-ci/.github/actions/secure-pip@57ff84f8ccaf936f3161b333e04761842ebc3778
    # The steps of pre-commit/action v3.0.1, inlined because that action uses
    # `actions/cache` unpinned, which the organization's SHA-pinning policy rejects.
    # virtualenv seeds the separate hook environments with its bundled pip.
    - run: python -m pip install pre-commit==4.6.2 'virtualenv>=21.14.12'
    - run: python -m pip freeze --local
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-emsign-20261022|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
    - run: pre-commit run --show-diff-on-failure --color=always --all-files
    - uses: pre-commit-ci/lite-action@062bca0919bc9d6e66755cc05074b70c77e111fc # v1.2.0
      if: always()
