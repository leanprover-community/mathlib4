name: Run pre-commit and in-place update PR on push

on:
  push:
    branches-ignore:
      # ignore tmp branches used by bors
      - 'staging.tmp*'
      - 'trying.tmp*'
      - 'staging*.tmp'
      - 'nolints'
      # ignore staging and trying branches used by bors, these are handled by bors.yml
      - 'staging'
      - 'trying'
      - 'ci-dev/**' # ignore branches meant for experiments
      - 'master'
  pull_request:

# extracted from https://pre-commit.ci/lite
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.x
    # The steps of pre-commit/action v3.0.1, inlined because that action uses
    # `actions/cache` unpinned, which the organization's SHA-pinning policy rejects.
    - run: python -m pip install pre-commit
    - run: python -m pip freeze --local
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
    - run: pre-commit run --show-diff-on-failure --color=always --all-files
    - uses: pre-commit-ci/lite-action@5d6cc0eb514c891a40562a58a8e71576c5c7fb43 # v1.1.0
      if: always()
