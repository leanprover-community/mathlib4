name: Check workflows
on:
  pull_request:
    paths:
      - '.github/**'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: suggester / actionlint
        uses: reviewdog/action-actionlint@419a49378266e892f40c773b4f2fc6de9aa87499 # v1.80.4
        with:
          tool_name: actionlint
          fail_level: any
          # actionlint 1.7.12 does not know the parallel-steps keys (`background`,
          # `parallel`, `wait`, `wait-all`, `cancel`) and does not see the steps inside
          # a `parallel` group, so it reports the keys and the `steps.<id>` references
          # to group members. The action splits this string on spaces without quote
          # handling, so the patterns use `.` for spaces and quotes. Remove the patterns
          # when actionlint ships rhysd/actionlint#694.
          actionlint_flags: >-
            -ignore unexpected.key..background.
            -ignore step.must.run.script.with..run..section.or.run.action.with..uses..section
            -ignore property..(archive|counterexamples|wanted|noisy)..is.not.defined

  ensure-sha-pinned-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Our fork of zgosalvez/github-actions-ensure-sha-pinned-actions. It reports every
      # violation (not just the first) and checks the steps inside `parallel` groups.
      - name: Ensure all actions are pinned to SHA
        uses: leanprover-community/github-actions-ensure-sha-pinned-actions@538f919501d732b8cd7f5215aec5896df7d1df22 # improve-error-reporting
