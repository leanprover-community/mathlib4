name: Monitor Dependency Update Failures

on:
  workflow_run:
    workflows: ["continuous integration"]
    types:
      - completed
    branches:
      - 'update-dependencies-**'

jobs:
  monitor-failures:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'leanprover-community/mathlib4' && github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the commit CI ran on; `workflow_run` would otherwise check out master
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2  # Need previous commit for diff
          persist-credentials: false # no later step needs git credentials

      - name: Checkout local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          sparse-checkout: .github/actions
          path: workflow-actions
      - name: Get mathlib-ci
        uses: ./workflow-actions/.github/actions/get-mathlib-ci

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Parse dependency changes
        id: parse_changes
        run: |
          output="$("${CI_SCRIPTS_DIR}/zulip/parse_lake_manifest_changes.py")"
          echo "Dependency changes:"
          echo "$output"
          delimiter="EOF"
          printf 'changes<<%s\n%s\n%s\n' "$delimiter" "$output" "$delimiter" >> "$GITHUB_OUTPUT"

      - name: Construct message
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: construct_message
        env:
          CHANGES: ${{ steps.parse_changes.outputs.changes }}
        with:
          result-encoding: string
          script: |
            let output = "❌ `lake update` [failed](" + context.payload.workflow_run.html_url + "). "
            let prs = context.payload.workflow_run.pull_requests
            if (prs.length) {
              for (let pr of prs) {
                output += "Found [PR " + pr.number + "](" + context.payload.repository.html_url + "/pull/" + pr.number + "). "
              }
            } else {
              output += "No PR found for this run! If you are feeling impatient and have write access, please go to the following page and click the \"Run workflow\" button!\nhttps://github.com/leanprover-community/mathlib4/actions/workflows/update_dependencies.yml";
            }
            output += "\n\n" + process.env.CHANGES;
            return output;

      - name: Send Zulip message
        uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: 'github-mathlib4-bot@leanprover.zulipchat.com'
          organization-url: 'https://leanprover.zulipchat.com'
          to: 'nightly-testing-mathlib'
          type: 'stream'
          topic: 'Mathlib `lake update` failure'
          content: |
            ${{ steps.construct_message.outputs.result }}

  monitor-success:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'leanprover-community/mathlib4' && github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the commit CI ran on; `workflow_run` would otherwise check out master
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2  # Need previous commit for diff
          persist-credentials: false # no later step needs git credentials

      - name: Checkout local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          sparse-checkout: .github/actions
          path: workflow-actions
      - name: Get mathlib-ci
        uses: ./workflow-actions/.github/actions/get-mathlib-ci

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Parse dependency changes
        id: parse_changes
        run: |
          output="$("${CI_SCRIPTS_DIR}/zulip/parse_lake_manifest_changes.py")"
          echo "Dependency changes:"
          echo "$output"
          delimiter="EOF"
          printf 'changes<<%s\n%s\n%s\n' "$delimiter" "$output" "$delimiter" >> "$GITHUB_OUTPUT"

      - name: Construct success message
        id: construct_message
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANGES: ${{ steps.parse_changes.outputs.changes }}
        with:
          result-encoding: string
          script: |
            let output = "✅ `lake update` succeeded! "
            let prs = context.payload.workflow_run.pull_requests
            if (prs.length) {
              for (let pr of prs) {
                output += "#" + pr.number + " passed CI and is ready for review. ";
              }
              output += "\n\n" + process.env.CHANGES;
              return output
            }
            return ''  // Return empty string if no PRs found

      - name: Send Zulip message
        if: ${{ steps.construct_message.outputs.result != '' }}
        uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: 'github-mathlib4-bot@leanprover.zulipchat.com'
          organization-url: 'https://leanprover.zulipchat.com'
          to: 'nightly-testing-mathlib'
          type: 'stream'
          topic: 'Mathlib `lake update` success'
          content: |
            ${{ steps.construct_message.outputs.result }}
