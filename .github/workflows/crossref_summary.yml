# Cross-reference summary (post-build)
# Comments on a PR with the cross-references it adds, each as a clickable link.
#
# - Reads `crossrefs.json` from the build's `import-graph` artifact (written by
#   `scripts/export_crossrefs.lean`; see `build_template.yml`'s `post_steps`).
# - Subtracts the master export published by `export_crossrefs.yml`.
# - Posts or updates a marker-keyed comment on the PR.
#
# Fork PRs only: `build_fork.yml` is the only build running on `pull_request_target`.

name: Cross-reference summary (post-build)

on:
  workflow_run:
    workflows: ["continuous integration (mathlib forks)"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  COMMENT_MARKER: '<!-- crossref-summary -->'
  BASELINE_URL: https://raw.githubusercontent.com/leanprover-community/crossref-exports/master/crossrefs.json

jobs:
  crossrefs:
    if: >-
      github.repository == 'leanprover-community/mathlib4'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download the import-graph artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: import-graph
          path: ./artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PR number
        id: pr
        run: |
          set -euo pipefail
          PR_NUMBER="$(tr -dc '0-9' < ./artifact/pr_number.txt 2>/dev/null || true)"
          echo "pr-number=$PR_NUMBER" | tee -a "$GITHUB_OUTPUT"

      # Trusted checkout: base-repo actions only, never the PR's code.
      - name: Checkout local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          sparse-checkout: .github/actions
          path: workflow-actions

      - name: Get mathlib-ci
        uses: ./workflow-actions/.github/actions/get-mathlib-ci

      - name: Build the comment
        id: report
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          MARKER: ${{ env.COMMENT_MARKER }}
        run: |
          set -euo pipefail

          if [ ! -f ./artifact/crossrefs.json ]; then
            echo "state=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Without a baseline every existing tag would look new, so skip instead.
          if ! curl -sSfL --max-time 60 "$BASELINE_URL" -o baseline.json; then
            echo "state=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 "$CI_SCRIPTS_DIR/pr_summary/crossrefsDiff.py" \
            --base-crossrefs baseline.json \
            --head-crossrefs ./artifact/crossrefs.json \
            --repo "$REPO" --new-sha "$SHA" \
            --table-out table.md

          if [ ! -f table.md ]; then
            echo "state=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            printf '%s\n\n' "$MARKER"
            printf '### Cross-references added in this PR\n\n'
            cat table.md
          } > report.md

          echo "state=found" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing cross-reference comment
        if: steps.pr.outputs.pr-number != ''
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: find-comment
        with:
          issue-number: ${{ steps.pr.outputs.pr-number }}
          comment-author: 'github-actions[bot]'
          body-includes: ${{ env.COMMENT_MARKER }}

      - name: Post or update the cross-reference summary
        if: steps.report.outputs.state == 'found' && steps.pr.outputs.pr-number != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.pr-number }}
          body-path: report.md
          edit-mode: replace

      # Only when a comment already exists, so PRs that never added a
      # cross-reference are not commented on.
      - name: Clear a stale cross-reference summary
        if: steps.report.outputs.state == 'none' && steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.pr-number }}
          body: |
            ${{ env.COMMENT_MARKER }}
            This PR no longer adds any cross-reference attributes.
          edit-mode: replace
