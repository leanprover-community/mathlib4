name: continuous integration

on:
  push:
    branches-ignore:
      # ignore tmp branches used by bors
      - 'staging.tmp*'
      - 'trying.tmp*'
      - 'staging*.tmp'
      # ignore staging and trying branches used by bors, these are handled by bors.yml
      - 'staging'
      - 'trying'
      # ignore branches meant for experiments
      - 'ci-dev/**'

concurrency:
  # label each workflow run; only the latest with each label will run
  # workflows on master get more expressive labels
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.run_id) || '' }}
  # cancel any running workflow with the same label
  cancel-in-progress: true

# Limit permissions for GITHUB_TOKEN for the entire workflow
permissions:
  contents: read
  id-token: write
  actions: read  # Allow get-tools to download the prebuilt tools artifact from master's publish_tools runs
  pull-requests: write  # Only allow PR comments/labels
  # All other permissions are implicitly 'none'

jobs:
  build:
    name: ci
    if: ${{ github.repository == 'leanprover-community/mathlib4' || github.repository == 'leanprover-community/mathlib4-nightly-testing' }}
    uses: ./.github/workflows/build_template.yml
    with:
      concurrency_group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.run_id) || '' }}
      pr_branch_ref: ${{ github.sha }}
      # The OIDC environment of the upload jobs. The cache writer credentials are scoped to it.
      cache_environment: >-
        ${{
             (github.repository == 'leanprover-community/mathlib4'
               && github.ref_name == 'master')
               && 'cache-upload-master'
          || (github.repository == 'leanprover-community/mathlib4')
               && 'cache-upload-forks'
          || 'cache-upload-nightly-testing'
        }}
      # the single producer: the master `push` build
      publish_cache: ${{ github.repository == 'leanprover-community/mathlib4' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      # A master push lands the tree that the bors staging build of the same commit validated.
      # It publishes the cache and the summary, and does not run the checks again.
      revalidate: ${{ !(github.repository == 'leanprover-community/mathlib4' && github.event_name == 'push' && github.ref == 'refs/heads/master') }}
      run_post_ci: ${{ !(github.repository == 'leanprover-community/mathlib4' && github.event_name == 'push' && github.ref == 'refs/heads/master') }}
      runs_on: pr
    secrets: inherit
