name: ci dev

# Experiment: time `runLinter Mathlib` with four Batteries variants on one runner.
# See scripts/lint-bench/run.sh.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Number of rounds of the four variants
        required: false
        type: string
        default: '3'

permissions:
  contents: read
  actions: read

env:
  LAKE_NO_CACHE: true
  MATHLIB_CACHE_BASE_URL: ${{ vars.MATHLIB_CACHE_BASE_URL }}
  MATHLIB_CACHE_PARALLEL_MAX: ${{ vars.MATHLIB_CACHE_PARALLEL_MAX }}

jobs:
  lint_bench:
    name: lint benchmark
    if: ${{ github.repository == 'leanprover-community/mathlib4' && github.ref_type == 'branch' && startsWith(github.ref_name, 'ci-dev/') }}
    runs-on: pr
    timeout-minutes: 150
    steps:
      - name: Checkout local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          sparse-checkout: .github/actions
          path: workflow-actions
          persist-credentials: false

      - name: Set up build environment
        uses: ./workflow-actions/.github/actions/setup-build-env
        with:
          pr_branch_ref: ${{ github.sha }}
          tools_branch_ref: ''

      - name: Get cache
        uses: ./workflow-actions/.github/actions/get-cache
        with:
          working_directory: pr-branch
          cache_bin: ../tools-branch/.lake/build/bin/cache

      - name: verify the Mathlib cache is complete
        run: |
          cd pr-branch
          lake build --no-build Mathlib

      - name: lint benchmark
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          cd pr-branch
          scripts/lint-bench/run.sh "$ROUNDS"
