name: ci dev

# Runner-fleet benchmark. Targets one label per dispatch:
#   ephemeral -> a hoskinson box, pr / bors -> a Hetzner box,
#   or any label an operator has attached to a specific runner.
#
# mode=full is the one-shot comprehensive run: facts, a filesystem matrix,
# syscall and CPU benchmarks, then a clean full Mathlib build, all in a
# single job so one scheduling opportunity yields every number.

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: runner label (ephemeral = hoskinson, pr/bors = hetzner, or a hand-attached label)
        required: false
        type: string
        default: 'pr'
      mode:
        description: bench | build | full | parallel (lint+test core usage and concurrency)
        required: false
        type: string
        default: 'full'
      files:
        description: file count for the deep file-operation benchmark
        required: false
        type: string
        default: '100000'
      matrix_files:
        description: file count for the per-filesystem matrix (must fit in /dev/shm, 64 MB)
        required: false
        type: string
        default: '20000'
      cpu_seconds:
        description: seconds per CPU measurement
        required: false
        type: string
        default: '3'
      reps:
        description: repetitions of each arm
        required: false
        type: string
        default: '2'
      work_root:
        description: bench mode only — directory to write in
        required: false
        type: string
        default: 'bench'
      build_ref:
        description: mathlib commit to build in build/full mode
        required: false
        type: string
        default: ''
      cache_get_url:
        description: anonymous mathlib cache read endpoint
        required: false
        type: string
        default: 'https://cache.mathlib.org/mathlib4'
      skip_build:
        description: full mode — set true to skip the clean build
        required: false
        type: string
        default: 'false'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- full ---
  fullbench:
    name: ci (dev branch) full characterisation
    # For sanity and intentionality, only trigger this from branches ci-dev/*
    if: ${{ inputs.mode == 'full' && github.repository == 'leanprover-community/mathlib4' && github.ref_type == 'branch' && startsWith(github.ref_name, 'ci-dev/') }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 180
    env:
      # Lake's own cloud-build cache is incompatible with Mathlib's `cache`.
      LAKE_NO_CACHE: true
    steps:
      - name: checkout the benchmark scripts only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github

      - name: machine facts
        continue-on-error: true
        shell: bash
        run: |
          echo "label requested: ${{ inputs.runs_on }}"
          bash .github/ci-dev/fullbench.sh

      # The centrepiece. The same file benchmark on three filesystems the job
      # can reach, so the container's overlay2 upper layer is isolated from
      # the host store and from RAM. A large workspace-vs-hoststore gap is the
      # direct case for moving the unpacked olean tree onto a bind mount.
      - name: filesystem matrix
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          N="${{ inputs.matrix_files }}"
          run_fs() { # name, path
            if [ -d "$2" ] && [ -w "$2" ]; then
              mkdir -p "$2/cidev-bench" 2>/dev/null || { echo "SKIP $1 (mkdir failed)"; return; }
              bash .github/ci-dev/bench.sh "fs-$1" "$N" 0 "$2/cidev-bench" files
              rm -rf "$2/cidev-bench"
            else
              echo "SKIP $1 ($2 missing or not writable)"
            fi
          }
          for i in $(seq 1 "${{ inputs.reps }}"); do
            echo "::group::rep $i — workspace (container overlay2 upper)"
            run_fs "workspace$i" "$PWD"
            echo "::endgroup::"
            echo "::group::rep $i — hoststore (bind-mounted warm cache store)"
            run_fs "hoststore$i" /home/lean/.cache/mathlib
            echo "::endgroup::"
            echo "::group::rep $i — tmpfs (RAM)"
            run_fs "tmpfs$i" /dev/shm
            echo "::endgroup::"
          done

      - name: deep file benchmark, syscall and CPU
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p bench
          for i in $(seq 1 "${{ inputs.reps }}"); do
            echo "::group::rep $i — deep, on the workspace"
            bash .github/ci-dev/bench.sh "deep$i" "${{ inputs.files }}" "${{ inputs.cpu_seconds }}" bench all
            echo "::endgroup::"
          done
          # Sequential write on the host store too, for comparison with the
          # workspace figure above.
          if [ -w /home/lean/.cache/mathlib ]; then
            mkdir -p /home/lean/.cache/mathlib/cidev-dd
            bash .github/ci-dev/bench.sh "hoststore-dd" 0 0 /home/lean/.cache/mathlib/cidev-dd dd
            rm -rf /home/lean/.cache/mathlib/cidev-dd
          fi

      # Last, so a build failure cannot cost us the measurements above.
      - name: checkout mathlib at the commit under test
        if: ${{ inputs.skip_build != 'true' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}
          fetch-depth: 1
          path: build-src

      - name: install the toolchain
        if: ${{ inputs.skip_build != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          cd build-src
          TIMEFORMAT='TIMED toolchain real=%3R user=%3U sys=%3S'
          time {
            if ! command -v elan >/dev/null; then
              curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
            fi
            export PATH="$HOME/.elan/bin:$PATH"
            elan toolchain install "$(cat lean-toolchain)"
          }
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: clean full build of Mathlib
        if: ${{ inputs.skip_build != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          BENCH="$PWD/.github/ci-dev"
          cd build-src
          echo "commit:    $(git rev-parse HEAD)"
          echo "toolchain: $(cat lean-toolchain)"

          # This machine may host a second runner, so account for whole-machine
          # CPU across the build. /proc/stat is not namespaced, so it sees every
          # core on the host. own_share well under 1.0 means a neighbour was
          # competing and this wall clock is not comparable to the other fleets.
          bash "$BENCH/contention.sh" sample /tmp/load.txt 15 &
          sampler=$!
          before=$(bash "$BENCH/contention.sh" busy)
          start=$(date +%s.%N)
          # `times` must run in THIS shell, not a subshell, or the children
          # accounting is empty. Redirecting a builtin keeps it in-process.
          times > /tmp/times_before.txt

          # No `cache get`: every olean is compiled here, on every fleet.
          TIMEFORMAT='TIMED lakebuild real=%3R user=%3U sys=%3S'
          time lake build Mathlib

          times > /tmp/times_after.txt
          end=$(date +%s.%N)
          after=$(bash "$BENCH/contention.sh" busy)
          kill "$sampler" 2>/dev/null || true

          echo "oleans:    $(find .lake/build/lib -name '*.olean' 2>/dev/null | wc -l)"
          wall=$(awk -v a="$start" -v b="$end" 'BEGIN{printf "%.1f", b-a}')
          own=$(bash "$BENCH/contention.sh" cputimes /tmp/times_before.txt /tmp/times_after.txt)
          bash "$BENCH/contention.sh" report "$before" "$after" "$own" "$wall"
          echo "--- load samples ---"; tail -40 /tmp/load.txt 2>/dev/null || true
          exit 0

      - name: how to read this
        if: always()
        shell: bash
        run: |
          echo "Effective cores  = (user+sys)/real from the TIMED lakebuild line."
          echo "Container tax    = fs-workspace / fs-hoststore on create_*_files."
          echo "Filesystem tax   = fs-hoststore / fs-tmpfs."
          echo "Compare across fleets: cpu_gzip_256MiB_1x (fair integer),"
          echo "syscall_1e6_getpid, create_100000_files, and the build wall clock."

  # --------------------------------------------------------------- bench ---
  bench:
    name: ci (dev branch)
    if: ${{ inputs.mode == 'bench' && github.repository == 'leanprover-community/mathlib4' && github.ref_type == 'branch' && startsWith(github.ref_name, 'ci-dev/') }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - name: checkout the benchmark scripts only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github

      - name: machine facts
        shell: bash
        run: bash .github/ci-dev/fullbench.sh

      - name: run the benchmark, plain shell vs landrun
        shell: bash
        run: |
          set -uo pipefail
          ROOT="${{ inputs.work_root }}"; mkdir -p "$ROOT"
          # A hoskinson container starts cold: these paths exist only on the
          # Hetzner hosts, where they are bind-mounted warm stores. landrun
          # refuses to build a ruleset for a missing path, so create them and
          # keep the sandbox flags identical to the real workflow's.
          mkdir -p /home/lean/.elan /home/lean/.cache/mathlib
          N="${{ inputs.files }}"; C="${{ inputs.cpu_seconds }}"; R="${{ inputs.reps }}"
          LR=(landrun --rox /usr --ro /etc/timezone --rw /dev --rox /home/lean/.elan --rox /home/lean/actions-runner/_work --rox /home/lean/.cache/mathlib/ --rw "$ROOT" --env PATH --env HOME --env CI --)
          for i in $(seq 1 "$R"); do
            echo "::group::rep $i — plain shell"
            bash .github/ci-dev/bench.sh "plain$i" "$N" "$C" "$ROOT" all
            echo "::endgroup::"
            echo "::group::rep $i — under landrun"
            "${LR[@]}" bash .github/ci-dev/bench.sh "landrun$i" "$N" "$C" "$ROOT" all
            echo "::endgroup::"
          done

  # --------------------------------------------------------------- build ---
  fullbuild:
    name: ci (dev branch) full build
    if: ${{ inputs.mode == 'build' && github.repository == 'leanprover-community/mathlib4' && github.ref_type == 'branch' && startsWith(github.ref_name, 'ci-dev/') }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 150
    env:
      LAKE_NO_CACHE: true
    steps:
      - name: machine facts
        shell: bash
        run: |
          echo "runner=${RUNNER_NAME:-?} label=${{ inputs.runs_on }}"
          uname -a; nproc
          lscpu 2>/dev/null | grep -E "Model name|Socket|Core\(s\)|Thread\(s\)|MHz|L3|Hypervisor" || true
          free -g | head -2

      - name: checkout mathlib at the commit under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}
          fetch-depth: 1
          path: build-src

      - name: install the toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd build-src
          TIMEFORMAT='TIMED toolchain real=%3R user=%3U sys=%3S'
          time {
            if ! command -v elan >/dev/null; then
              curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
            fi
            export PATH="$HOME/.elan/bin:$PATH"
            elan toolchain install "$(cat lean-toolchain)"
          }
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: clean full build of Mathlib
        shell: bash
        run: |
          set -uo pipefail
          cd build-src
          echo "commit: $(git rev-parse HEAD)"
          echo "toolchain: $(cat lean-toolchain)"
          TIMEFORMAT='TIMED lakebuild real=%3R user=%3U sys=%3S'
          time lake build Mathlib
          echo "oleans: $(find .lake/build/lib -name '*.olean' 2>/dev/null | wc -l)"

  # ------------------------------------------------------------- parallel ---
  # Do `lake test` and `lake lint` leave cores idle, and can they run at the
  # same time in one workspace? Together they are 67% of a median pull
  # request, so this decides whether overlapping them is worth anything.
  parallel:
    name: ci (dev branch) lint+test parallelism
    if: ${{ inputs.mode == 'parallel' && github.repository == 'leanprover-community/mathlib4' && github.ref_type == 'branch' && startsWith(github.ref_name, 'ci-dev/') }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 180
    env:
      LAKE_NO_CACHE: true
      MATHLIB_CACHE_GET_URL: ${{ inputs.cache_get_url }}
    steps:
      - name: checkout the benchmark scripts only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github

      - name: machine facts
        continue-on-error: true
        shell: bash
        run: bash .github/ci-dev/fullbench.sh

      - name: checkout mathlib at the commit under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}
          fetch-depth: 1
          path: pr-branch

      - name: install the toolchain
        shell: bash
        run: |
          set -uo pipefail
          cd pr-branch
          if ! command -v elan >/dev/null; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # A cache miss here would build Mathlib from source and blow the budget,
      # so it is capped and reported rather than left to run.
      - name: get the mathlib cache
        id: cache
        shell: bash
        run: |
          set -uo pipefail
          cd pr-branch
          bash ../.github/ci-dev/measure.sh cacheget 1200 lake exe cache get
          echo "oleans=$(find .lake/build/lib -name '*.olean' 2>/dev/null | wc -l)"

      # Both drivers BUILD a target first (testDriver MathlibTest, lintDriver
      # batteries/runLinter). Build those once up front so the measured arms
      # all start from the same warm state and compare like with like.
      - name: warm up both drivers
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          cd pr-branch
          bash ../.github/ci-dev/measure.sh warm_test 2400 lake --iofail test
          bash ../.github/ci-dev/measure.sh warm_lint 2400 env LEAN_ABORT_ON_PANIC=1 lake lint -- --trace

      - name: arm A — test alone
        continue-on-error: true
        shell: bash
        run: |
          cd pr-branch
          bash ../.github/ci-dev/measure.sh test_alone 2400 lake --iofail test

      - name: arm B — lint alone
        continue-on-error: true
        shell: bash
        run: |
          cd pr-branch
          bash ../.github/ci-dev/measure.sh lint_alone 2400 env LEAN_ABORT_ON_PANIC=1 lake lint -- --trace

      # The pair is wrapped in ONE measurement: two overlapping measurements
      # would each attribute the whole machine's CPU to themselves. Individual
      # spans are recorded separately, so a Lake workspace lock shows up as
      # two non-overlapping intervals.
      - name: arm C — both at the same time
        continue-on-error: true
        shell: bash
        run: |
          cd pr-branch
          cat > /tmp/pair.sh <<'INNER'
          set -uo pipefail
          ( s=$(date +%s); lake --iofail test > /tmp/c_test.log 2>&1;             echo "SPAN c_test $s $(date +%s) rc=$?" > /tmp/c_test.span ) &
          a=$!
          ( s=$(date +%s); env LEAN_ABORT_ON_PANIC=1 lake lint -- --trace > /tmp/c_lint.log 2>&1;             echo "SPAN c_lint $s $(date +%s) rc=$?" > /tmp/c_lint.span ) &
          b=$!
          wait $a; wait $b
          INNER
          bash ../.github/ci-dev/measure.sh concurrent 3600 bash /tmp/pair.sh
          echo "--- individual spans ---"; cat /tmp/c_test.span /tmp/c_lint.span 2>/dev/null
          echo "--- lake complaints, if any ---"
          grep -aiE "lock|another process|waiting|in use|busy" /tmp/c_test.log /tmp/c_lint.log 2>/dev/null | head -8 || echo "(none)"

      - name: verdict
        if: always()
        shell: bash
        run: |
          echo "eff_cores per arm answers: do lint and test leave cores idle?"
          echo "Overlap of the two SPAN intervals in arm C answers: does Lake"
          echo "serialise two invocations in one workspace?"
          echo "concurrent wall vs (test_alone + lint_alone) is the payoff."
