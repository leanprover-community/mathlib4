name: ci dev

# Cache-warmth probe (ci-dev experiment): verify a fresh job on the
# Hetzner fleet reuses the host cache store. `lake exe cache get` must
# find almost every .ltar archive already local (the hourly warmup keeps
# the store at master), and after unpacking, `lake build --no-build`
# must report nothing left to build. The probe branch is master content,
# so a warm store means near-zero downloads and a no-op build.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-warmth:
    name: cache warmth probe
    if: ${{ github.repository == 'leanprover-community/mathlib4' && github.ref_type == 'branch' && startsWith(github.ref_name, 'ci-dev/') }}
    runs-on: pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: host cache state before
        run: |
          echo "runner: $RUNNER_NAME"
          export PATH="$HOME/.elan/bin:$PATH"
          echo "== elan toolchains (host store) =="
          elan toolchain list || echo "no elan on PATH — store not mounted?"
          echo "== mathlib .ltar store size =="
          du -sh "$HOME/.cache/mathlib" || true
          find "$HOME/.cache/mathlib" -name '*.ltar' 2>/dev/null | wc -l | xargs echo ".ltar files:"

      - name: cache get (should be local hits, minimal download)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          start=$(date +%s)
          lake exe cache get 2>&1 | tee cache-get.log
          echo "== cache get wall time: $(( $(date +%s) - start ))s =="
          # Surface the download/decompress summary lines for the report.
          grep -iE "download|decompress|local|attempt" cache-get.log | tail -10 || true

      - name: assert the build is a no-op
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          start=$(date +%s)
          lake build --no-build
          echo "== --no-build check wall time: $(( $(date +%s) - start ))s =="
          echo "cache fully covered this commit: nothing left to build"
