name: ci dev

# TEST-ONLY: symlink-escape probe for the post-`lake env` `cache get` steps.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  symlink_probe:
    if: ${{ github.repository == 'leanprover-community/mathlib4' && startsWith(github.ref_name, 'ci-dev/') }}
    runs-on: pr
    defaults:
      run:
        shell: landrun --rox /usr --ro /etc/timezone --rw /dev --rox /home/lean/.elan --rox /home/lean/actions-runner/_work --rox /home/lean/.cache/mathlib/ --rw pr-branch/.lake/ --env PATH --env HOME --env CI -- bash -euxo pipefail {0}
    steps:
      - name: Checkout local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          sparse-checkout: .github/actions
          path: workflow-actions
          persist-credentials: false

      - name: Set up build environment
        uses: ./workflow-actions/.github/actions/setup-build-env
        with:
          pr_branch_ref: ${{ github.sha }}

      - name: landrun version and probe targets (outside sandbox)
        shell: bash
        run: |
          landrun --version || true
          uname -r
          rm -rf /tmp/probe /tmp/probe-archive
          mkdir -p /tmp/probe/lib/lean/Mathlib /tmp/probe-archive
          echo keep > /tmp/probe/lib/lean/Mathlib/SENTINEL

      # Probe 1: a symlinked parent directory before "Get cache".
      - name: "probe 1: plant .lake/build -> /tmp/probe (inside sandbox, as PR code)"
        run: |
          cd pr-branch
          rm -rf .lake/build
          ln -s /tmp/probe .lake/build
          ls -la .lake

      - name: Get cache
        id: getcache
        continue-on-error: true
        uses: ./workflow-actions/.github/actions/get-cache
        with:
          working_directory: pr-branch
          cache_bin: ../tools-branch/.lake/build/bin/cache

      - name: "probe 1: result"
        shell: bash
        run: |
          written=$(find /tmp/probe -type f ! -name SENTINEL | wc -l)
          if [ -f /tmp/probe/lib/lean/Mathlib/SENTINEL ]; then sentinel=intact; else sentinel=DELETED; fi
          verdict=CONTAINED
          if [ "${written}" -ne 0 ] || [ "${sentinel}" != intact ]; then verdict=ESCAPED; fi
          line="probe 1 (Get cache): ${verdict}: get-cache outcome=${{ steps.getcache.outcome }}, files written outside .lake/=${written}, sentinel=${sentinel}"
          echo "${line}"
          echo "${line}" >> "$GITHUB_STEP_SUMMARY"
          find /tmp/probe -maxdepth 5 | head -20 || true

      # Probe 2: a symlinked `Archive` output directory before the archive fetch.
      - name: "probe 2: plant .lake/build/lib/lean/Archive -> /tmp/probe-archive (inside sandbox, as PR code)"
        run: |
          cd pr-branch
          rm -f .lake/build
          mkdir -p .lake/build/lib/lean
          ln -s /tmp/probe-archive .lake/build/lib/lean/Archive
          ls -la .lake/build/lib/lean

      - name: fetch archive, counterexamples and wanted cache
        id: archive
        continue-on-error: true
        shell: landrun --unrestricted-network --rox /usr --rox /etc --rw /dev --rox /home/lean/.elan --rox /home/lean/actions-runner/_work --rwx /home/lean/.cache/mathlib/ --rw pr-branch/.lake/ --env PATH --env HOME --env CI --env TERM --env LEAN_SRC_PATH --env TRUSTED_LEAN_PREFIX --env MATHLIB_CACHE_FROM --env MATHLIB_CACHE_REPO_SCOPE --env MATHLIB_CACHE_GET_URL --env MATHLIB_CACHE_BASE_URL -- bash -euxo pipefail {0}
        run: |
          # Use the trusted toolchain's `lean`/`leantar` (see setup-build-env).
          export PATH="${TRUSTED_LEAN_PREFIX:?trusted toolchain sysroot not set}/bin:${PATH}"
          cd pr-branch
          ../tools-branch/.lake/build/bin/cache get Archive.lean
          ../tools-branch/.lake/build/bin/cache get Counterexamples.lean
          ../tools-branch/.lake/build/bin/cache get Wanted.lean

      - name: "probe 2: result"
        shell: bash
        run: |
          written=$(find /tmp/probe-archive -type f | wc -l)
          verdict=CONTAINED
          if [ "${written}" -ne 0 ]; then verdict=ESCAPED; fi
          line="probe 2 (fetch archive): ${verdict}: step outcome=${{ steps.archive.outcome }}, files written outside .lake/=${written}"
          echo "${line}"
          echo "${line}" >> "$GITHUB_STEP_SUMMARY"
          find /tmp/probe-archive -maxdepth 3 | head -20 || true
