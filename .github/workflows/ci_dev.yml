name: ci dev

# Runner-fleet micro-benchmark. Targets one label per dispatch:
#   ephemeral -> a hoskinson box, pr / bors -> a Hetzner box.
# Each run measures the same work twice on the SAME machine, once under
# landrun and once under a plain shell, so the sandbox cost is a paired
# within-machine difference with no hardware confound.

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: runner label (ephemeral = hoskinson, pr/bors = hetzner)
        required: false
        type: string
        default: 'pr'
      files:
        description: number of small files in the file-operation benchmark
        required: false
        type: string
        default: '100000'
      cpu_seconds:
        description: seconds per openssl speed measurement
        required: false
        type: string
        default: '3'
      work_root:
        description: directory the benchmark writes in (bench = container disk, /dev/shm = tmpfs)
        required: false
        type: string
        default: 'bench'
      mode:
        description: bench (micro-benchmarks) or build (clean full mathlib build)
        required: false
        type: string
        default: 'bench'
      build_ref:
        description: mathlib commit to build in build mode
        required: false
        type: string
        default: ''
      reps:
        description: repetitions of each arm
        required: false
        type: string
        default: '2'

permissions:
  contents: read

jobs:
  bench:
    name: ci (dev branch)
    # For sanity and intentionality, only trigger this from branches ci-dev/*
    if: ${{ inputs.mode == 'bench' && github.repository == 'leanprover-community/mathlib4' && github.ref_type == 'branch' && startsWith(github.ref_name, 'ci-dev/') }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - name: checkout the benchmark script only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github

      - name: machine facts
        shell: bash
        run: |
          set -uo pipefail
          echo "runner=${RUNNER_NAME:-?} label=${{ inputs.runs_on }}"
          echo "== kernel =="; uname -a
          echo "== cpu =="; nproc
          lscpu 2>/dev/null | grep -E "Model name|Vendor|Socket|Core\(s\)|Thread\(s\)|^CPU\(s\)|MHz|BogoMIPS|L3|Hypervisor|Virtual" || true
          echo "== memory =="; free -g 2>/dev/null | head -2
          echo "== filesystem for the workspace =="
          df -hT . 2>/dev/null
          echo "== warm-cache mounts =="
          df -hT /home/lean/.elan /home/lean/.cache/mathlib 2>/dev/null || echo "(not separate mounts)"
          mount 2>/dev/null | grep -E "overlay|/home/lean" | head -10 || true
          echo "== landrun =="
          command -v landrun || echo "landrun NOT on PATH"
          landrun --version 2>&1 | head -3 || true
          echo "== landlock ABI supported by this kernel =="
          python3 -c "import ctypes;l=ctypes.CDLL('libc.so.6');print('landlock_abi =', l.syscall(444, None, ctypes.c_size_t(0), ctypes.c_uint32(1)))" || true
          echo "== speculative-execution mitigations (a syscall-path tax) =="
          for f in /sys/devices/system/cpu/vulnerabilities/*; do
            printf '%s: %s\n' "$(basename "$f")" "$(cat "$f" 2>/dev/null)"
          done
          echo "== kernel cmdline =="; cat /proc/cmdline 2>/dev/null
          echo "== cpu mhz =="; grep -m2 -E "cpu MHz" /proc/cpuinfo 2>/dev/null || true
          echo "== syscall cost: 1e6 getpid via raw syscall =="
          python3 -c "import ctypes,time;l=ctypes.CDLL('libc.so.6');t=time.perf_counter();[l.syscall(39) for _ in range(1000000)];print('RESULT facts syscall_1e6_getpid %.3f'%(time.perf_counter()-t))" || true
          echo "== tool versions (cross-fleet CPU numbers are only comparable if these match) =="
          python3 --version; openssl version; bash --version | head -1

      - name: run the benchmark, plain shell vs landrun
        shell: bash
        run: |
          set -uo pipefail
          ROOT="${{ inputs.work_root }}"; mkdir -p "$ROOT"
          # A hoskinson container starts cold: these paths exist only on the
          # Hetzner hosts, where they are bind-mounted warm stores. landrun
          # refuses to build a ruleset for a missing path, so create them and
          # keep the sandbox flags identical to the real workflow's.
          mkdir -p /home/lean/.elan /home/lean/.cache/mathlib
          N="${{ inputs.files }}"; C="${{ inputs.cpu_seconds }}"; R="${{ inputs.reps }}"
          LR=(landrun --rox /usr --ro /etc/timezone --rw /dev --rox /home/lean/.elan --rox /home/lean/actions-runner/_work --rox /home/lean/.cache/mathlib/ --rw "$ROOT" --env PATH --env HOME --env CI --)
          for i in $(seq 1 "$R"); do
            echo "::group::rep $i — plain shell"
            bash .github/ci-dev/bench.sh "plain$i" "$N" "$C" "$ROOT"
            echo "::endgroup::"
            echo "::group::rep $i — under landrun"
            "${LR[@]}" bash .github/ci-dev/bench.sh "landrun$i" "$N" "$C" "$ROOT"
            echo "::endgroup::"
          done

      - name: summary
        if: always()
        shell: bash
        run: echo "Collect the RESULT lines from the log above."

  fullbuild:
    name: ci (dev branch) full build
    if: ${{ inputs.mode == 'build' && github.repository == 'leanprover-community/mathlib4' && github.ref_type == 'branch' && startsWith(github.ref_name, 'ci-dev/') }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 150
    env:
      # Lake's own cloud-build cache is incompatible with Mathlib's `cache`.
      LAKE_NO_CACHE: true
    steps:
      - name: machine facts
        shell: bash
        run: |
          set -uo pipefail
          echo "runner=${RUNNER_NAME:-?} label=${{ inputs.runs_on }}"
          uname -a; nproc
          lscpu 2>/dev/null | grep -E "Model name|Socket|Core\(s\)|Thread\(s\)|MHz|L3|Hypervisor" || true
          free -g | head -2

      - name: checkout mathlib at the commit under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}
          fetch-depth: 1
          path: build-src

      - name: install the toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd build-src
          TIMEFORMAT='TIMED toolchain real=%3R user=%3U sys=%3S'
          time {
            if ! command -v elan >/dev/null; then
              curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
            fi
            export PATH="$HOME/.elan/bin:$PATH"
            elan toolchain install "$(cat lean-toolchain)"
          }
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: clean full build of Mathlib
        shell: bash
        run: |
          set -uo pipefail
          cd build-src
          echo "commit: $(git rev-parse HEAD)"
          echo "toolchain: $(cat lean-toolchain)"
          echo "modules: $(grep -c '^import' Mathlib.lean || echo '?')"
          # No `cache get`: every olean is compiled here, on both fleets.
          TIMEFORMAT='TIMED lakebuild real=%3R user=%3U sys=%3S'
          time lake build Mathlib
          echo "oleans: $(find .lake/build/lib -name '*.olean' 2>/dev/null | wc -l)"

      - name: report
        if: always()
        shell: bash
        run: echo "Effective cores = (user+sys)/real from the TIMED lines above."
