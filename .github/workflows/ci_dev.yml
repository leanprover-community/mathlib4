name: ci dev

on:
  workflow_dispatch:
    inputs:
      order:
        description: Order of the two clean builds on one runner
        type: choice
        options: [baseline-patched, patched-baseline]
        default: baseline-patched

permissions:
  contents: read
  actions: read

concurrency:
  group: mathlib-unfold-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.repository == 'leanprover-community/mathlib4' && startsWith(github.ref_name, 'ci-dev/')
    name: Clean builds (${{ inputs.order }})
    runs-on: pr
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check runner and sandbox
        run: |
          command -v landrun
          nproc
          lscpu
          df -h .

      - name: Download the exact Lean baseline and PR release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v zstd >/dev/null; then
            curl --fail --location --retry 3 \
              https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz \
              --output "$RUNNER_TEMP/zstd-1.5.7.tar.gz"
            echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  $RUNNER_TEMP/zstd-1.5.7.tar.gz" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/zstd-1.5.7.tar.gz" -C "$RUNNER_TEMP"
            make -s -C "$RUNNER_TEMP/zstd-1.5.7/programs" -j"$(nproc)" zstd
            export PATH="$RUNNER_TEMP/zstd-1.5.7/programs:$PATH"
          fi
          mkdir -p "$RUNNER_TEMP/lean-baseline" "$RUNNER_TEMP/lean-patched" benchmark-results
          gh api repos/leanprover/lean4/actions/artifacts/11835156485 > benchmark-results/baseline-artifact.json
          jq -e '.expired == false and .workflow_run.head_sha == "daa56019e0ab113c164f5e13e6c9dae9d994c21b"' \
            benchmark-results/baseline-artifact.json
          gh run download 38439976971 --repo leanprover/lean4 --name 'build-Linux release' \
            --dir "$RUNNER_TEMP/lean-baseline"
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4-pr-releases/releases/download/pr-release-15670-f6b1bcc/lean-4.36.0-pre-linux.tar.zst \
            --output "$RUNNER_TEMP/lean-patched/lean-4.36.0-pre-linux.tar.zst"
          echo "58c6fbf981b7780ba8c8a61d9377a463c49aa2dbeb0524db946a4648468b126c  $RUNNER_TEMP/lean-patched/lean-4.36.0-pre-linux.tar.zst" | sha256sum --check
          for variant in baseline patched; do
            archive="$RUNNER_TEMP/lean-$variant/lean-4.36.0-pre-linux.tar.zst"
            tar --zstd -xf "$archive" -C "$RUNNER_TEMP/lean-$variant" --strip-components=1
            rm "$archive"
          done

      - name: Check all dependencies with both toolchains
        env:
          BENCH_ORDER: ${{ inputs.order }}
          BENCH_TOOLCHAINS: ${{ runner.temp }}
          BENCH_LANDRUN: '1'
        run: python3 .github/benchmarks/imported-unfold.py prepare

      - name: Measure two clean full Mathlib builds
        env:
          BENCH_ORDER: ${{ inputs.order }}
          BENCH_TOOLCHAINS: ${{ runner.temp }}
          BENCH_LANDRUN: '1'
        run: python3 .github/benchmarks/imported-unfold.py measure

      - name: Upload measurements and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mathlib-build-${{ inputs.order }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
