name: Merge conflicts

on:
  schedule:
    - cron: '*/15 * * * *' # run every 15 minutes
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    if: github.repository == 'leanprover-community/mathlib4'
    permissions:
      id-token: write
    steps:
      - name: Generate app token
        id: app-token
        uses: leanprover-community/mathlib-ci/.github/actions/mint-github-app-token@5c94feb419bec2cb85cb6aea6199431aabc0847c
        with:
          broker-url: ${{ vars.MATHLIB_GITHUB_APP_BROKER_URL }}
          audience: mathlib-github-app-broker
          app: mathlib-merge-conflicts

      - name: check if prs are dirty
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          dirtyLabel: "merge-conflict"
          commentOnDirty: "This pull request has conflicts, please merge `master` and resolve them."
          repoToken: ${{ steps.app-token.outputs.token }}
